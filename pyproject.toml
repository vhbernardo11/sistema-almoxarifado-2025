[project]
name = "integrasquad"
version = "0.3.0"
description = "Núcleo multiagente persistente do IntegraSquad"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
agents = ["openai-agents>=0.22.1,<0.23"]
storage = ["supabase>=2,<3"]
dev = ["pytest>=8,<10", "openai-agents>=0.22.1,<0.23"]
all = ["integrasquad[agents,storage,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
