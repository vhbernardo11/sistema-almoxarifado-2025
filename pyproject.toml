[project]
name = "integrasquad"
version = "0.2.0"
description = "Núcleo multiagente consolidado do IntegraSquad"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "openai-agents>=0.22.1,<0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
all = ["integrasquad[dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
